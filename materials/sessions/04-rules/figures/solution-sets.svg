<svg xmlns="http://www.w3.org/2000/svg" width="444" height="178" viewBox="0 0 444 178" role="img" aria-labelledby="title desc">
<title id="title">追加条件と解集合</title><desc id="desc">基本数独の288解のうち、合計6の条件を満たすのは48解。各行の和10を加える場合は288解のまま。</desc>
<g font-family="sans-serif" font-size="12" fill="#243443">
<text x="111" y="18" text-anchor="middle">三マスの合計6を追加</text>
<rect x="6" y="30" width="210" height="118" rx="10" fill="#f4f6f8" stroke="#81909d"/>
<text x="20" y="51">基本の288解</text>
<ellipse cx="130" cy="103" rx="65" ry="32" fill="#e4efea" stroke="#3d7961"/>
<text x="130" y="101" text-anchor="middle">合計6を満たす</text><text x="130" y="118" text-anchor="middle">48解（Pを含む）</text>
<text x="333" y="18" text-anchor="middle">各行の和10を追加</text>
<rect x="228" y="30" width="210" height="118" rx="10" fill="#e4efea" stroke="#3d7961"/>
<text x="333" y="83" text-anchor="middle">基本の288解すべて</text><text x="333" y="105" text-anchor="middle">各行の和はすでに10</text>
<text x="222" y="170" text-anchor="middle">追加すると解は増えない。減らない場合もある。</text>
</g></svg>

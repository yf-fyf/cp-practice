<svg xmlns="http://www.w3.org/2000/svg" width="300" height="240" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
<title id="title">近畿の7地域と12辺</title>
<desc id="desc">K-H、K-O、K-N、K-S、K-M、H-O、O-N、O-W、S-M、N-W、N-M、W-Mを結ぶ。地理的な位置を表す図ではない。</desc>
<g stroke="#697889" stroke-width="2">
<line data-edge="K-H" x1="180" y1="40" x2="50" y2="40"/>
<line data-edge="K-O" x1="180" y1="40" x2="60" y2="160"/>
<line data-edge="K-N" x1="180" y1="40" x2="190" y2="160"/>
<line data-edge="K-S" x1="180" y1="40" x2="350" y2="40"/>
<line data-edge="K-M" x1="180" y1="40" x2="320" y2="160"/>
<line data-edge="H-O" x1="50" y1="40" x2="60" y2="160"/>
<line data-edge="O-N" x1="60" y1="160" x2="190" y2="160"/>
<line data-edge="O-W" x1="60" y1="160" x2="190" y2="280"/>
<line data-edge="S-M" x1="350" y1="40" x2="320" y2="160"/>
<line data-edge="N-W" x1="190" y1="160" x2="190" y2="280"/>
<line data-edge="N-M" x1="190" y1="160" x2="320" y2="160"/>
<line data-edge="W-M" x1="190" y1="280" x2="320" y2="160"/>
</g><g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#233347">
<rect x="145" y="16" width="70" height="48" rx="6" fill="#f1f5f8" stroke="#697889"/>
<text x="180" y="36">京都<tspan x="180" dy="20">K</tspan></text>
<rect x="25" y="136" width="70" height="48" rx="6" fill="#f1f5f8" stroke="#697889"/>
<text x="60" y="156">大阪<tspan x="60" dy="20">O</tspan></text>
<rect x="15" y="16" width="70" height="48" rx="6" fill="#f1f5f8" stroke="#697889"/>
<text x="50" y="36">兵庫<tspan x="50" dy="20">H</tspan></text>
<rect x="315" y="16" width="70" height="48" rx="6" fill="#f1f5f8" stroke="#697889"/>
<text x="350" y="36">滋賀<tspan x="350" dy="20">S</tspan></text>
<rect x="155" y="136" width="70" height="48" rx="6" fill="#f1f5f8" stroke="#697889"/>
<text x="190" y="156">奈良<tspan x="190" dy="20">N</tspan></text>
<rect x="155" y="256" width="70" height="48" rx="6" fill="#f1f5f8" stroke="#697889"/>
<text x="190" y="276">和歌山<tspan x="190" dy="20">W</tspan></text>
<rect x="285" y="136" width="70" height="48" rx="6" fill="#f1f5f8" stroke="#697889"/>
<text x="320" y="156">三重<tspan x="320" dy="20">M</tspan></text>
</g></svg>

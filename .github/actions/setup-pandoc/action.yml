name: Set up Pandoc
description: Install the verified official Pandoc release on Linux amd64

runs:
  using: composite
  steps:
    - name: Download and verify Pandoc
      shell: bash
      env:
        PANDOC_VERSION: "3.14"
        PANDOC_SHA256: "c5f4720cdefb3f7bdc5d07202ef579feef0d1370773c873804dd8fdaa8c4f1b8"
      run: |
        archive="$RUNNER_TEMP/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
        curl --fail --location --silent --show-error --retry 3 \
          "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$PANDOC_SHA256" "$archive" | sha256sum --check
        tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
        printf '%s\n' "$RUNNER_TEMP/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
    - name: Show Pandoc version
      shell: bash
      run: pandoc --version

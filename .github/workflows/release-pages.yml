name: Release Pages

# 手動実行専用。Actions の Release Pages で dev を選び、version（例: v1.0.1）を指定する。
# 成功すると公開物が main へ push され、GitHub Pages が main から配信する。
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version used in the ZIP file name, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Pandoc
        uses: ./.github/actions/setup-pandoc
      - name: Install PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: Test publication checks
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check Python sources
        run: python3 -m compileall -q tools workbook
      - name: Check the site for broken internal links
        run: make site && make check-links
      - name: Check documentation consistency
        run: make check-docs
      - name: Build the allowlisted Pages tree
        run: python3 tools/build_pages.py "$VERSION" --output "$RUNNER_TEMP/pages" --revision "$GITHUB_SHA"
      - name: Check the assembled tree for broken links
        # リリースZIPへのリンクを含む組立後の成果物も検査する
        run: python3 tools/build_site.py --check-links --output "$RUNNER_TEMP/pages"
      - name: Verify the release archive
        run: unzip -t "$RUNNER_TEMP/pages/downloads/cp-practice-workbook-$VERSION.zip"
      - name: Publish main branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_DIR: ${{ runner.temp }}/pages
        run: |
          release_dir="$RUNNER_TEMP/pages-branch"
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$release_dir"
          if git -C "$release_dir" ls-remote --exit-code --heads origin main; then
            git -C "$release_dir" fetch origin main
            git -C "$release_dir" checkout -B main origin/main
          else
            git -C "$release_dir" checkout --orphan main
          fi
          git -C "$release_dir" rm -rf --ignore-unmatch .
          cp -a "$PAGES_DIR/." "$release_dir/"
          git -C "$release_dir" add --all
          git -C "$release_dir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Release $VERSION from ${GITHUB_SHA}"
          git -C "$release_dir" push origin main

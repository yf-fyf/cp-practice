name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Pandoc
        uses: ./.github/actions/setup-pandoc
      - name: Install PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
      - name: Build the site
        run: make site
      - name: Check internal links
        run: make check-links
      - name: Check documentation consistency
        run: make check-docs
      - name: Test publication checks
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check Python sources
        run: python3 -m compileall -q tools workbook

# 演習モデル（MiniZinc）・演習コード（Z3）は CI では走らせない
# 動作確認はローカルで行い、
# 結果を非公開 ../cp-practice-design/teacher/quality/records/ に記録する。
